aid: cambly
name: Cambly
description: 'Cambly is an online English-language learning platform, founded in 2012 and based in San Francisco,
  that connects English learners in more than 190 countries with native-speaking tutors over on-demand video
  chat. Its consumer products include Cambly (adult learners), Cambly Kids (ages 4-15), Cambly Pro, and Cambly
  for Organizations/Business. Backed by Bessemer Venture Partners, GV, and Y Combinator, the company operates a
  marketplace connecting students and tutors with weekly payouts. Cambly does not currently publish a public
  developer API or developer portal; this API Evangelist profile captures its public company surface, GitHub
  organization, and domain-security posture.'
